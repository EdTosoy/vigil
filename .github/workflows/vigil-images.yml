name: Publish Vigil ARM64 images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vigil-ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ARM64 images
        env:
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for target in ops stripe admin; do
            image="ghcr.io/edtosoy/vigil-$target:sha-$REVISION"
            docker buildx build --platform linux/arm64 \
              --file container/Dockerfile --target "$target" \
              --build-arg "VIGIL_IMAGE_REVISION=$REVISION" \
              --label "org.opencontainers.image.source=https://github.com/EdTosoy/vigil" \
              --tag "$image" --push .
            echo "- $target: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          done

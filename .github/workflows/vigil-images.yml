name: Publish Vigil ARM64 images

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vigil-ecr-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Authenticate to AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.VIGIL_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Verify AWS account
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = '747240980964'
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push three ARM64 images
        env:
          REGISTRY: 747240980964.dkr.ecr.ap-southeast-2.amazonaws.com
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for target in ops stripe admin; do
            repo="$REGISTRY/flow-demo/$target"
            docker buildx build --platform linux/arm64 \
              --file container/Dockerfile --target "$target" \
              --build-arg "VIGIL_IMAGE_REVISION=$REVISION" \
              --tag "$repo:sha-$REVISION" --push .
            digest="$(aws ecr describe-images \
              --repository-name "flow-demo/$target" \
              --image-ids "imageTag=sha-$REVISION" \
              --query 'imageDetails[0].imageDigest' --output text)"
            test "$digest" != None && test -n "$digest"
            echo "- $target: \`$repo@$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

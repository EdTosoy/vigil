name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Prepare the pinned image for isolated storage-safety probes
        run: |
          docker compose version
          docker pull postgres:18@sha256:fc973eb97c9fd04bfa1840e0f510719a584ccb3be8debfe6a4144637a9dfe8cf
      - run: pnpm test:unit
      - run: pnpm build

  database-integration:
    needs: verify
    runs-on: ubuntu-24.04
    # The existing real-database suite took about 25 minutes locally, before
    # runner variability and browser/build setup. Keep every test's own deadline.
    timeout-minutes: 90
    env:
      NX_DAEMON: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Deliberate release-enforcement failure (disposable PR only)
        run: |
          echo "Acceptance probe: keep database check pending, then deliberately fail it."
          sleep 45
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify disposable-database prerequisites
        run: |
          docker version
          docker compose version
      - name: Install the pinned Playwright Chromium and system libraries
        run: pnpm exec playwright install --with-deps chromium
      - name: Select the pinned browser instead of an ambient system Chromium
        run: node -e "console.log('PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=' + require('@playwright/test').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: pnpm build
      - name: Verify migrations, financial invariants, concurrency, recovery and authenticated browser journeys
        run: pnpm test:integration

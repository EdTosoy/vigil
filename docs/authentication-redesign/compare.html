<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Vigil authentication comparison</title
  ><style>
    :root {
      --paper: #f4f6f5;
      --ink: #1d2c34;
      --font: system-ui, sans-serif;
    }
    body {
      margin: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font);
    }
    h1,
    h2 {
      font-weight: 600;
    }
    .pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
    figure {
      margin: 0;
    }
    figcaption {
      margin-bottom: 12px;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    @media (max-width: 600px) {
      .pair {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>
  <h1>Vigil authentication</h1>
  <p>Matching widths, with the existing synthetic visitor option enabled.</p>
  <section>
    <h2>320px</h2>
    <div class="pair">
      <figure>
        <figcaption>Before</figcaption>
        <img
          src="before/sign-in-320.png"
          alt="Original Vigil sign-in at 320px"
        />
      </figure>
      <figure>
        <figcaption>After</figcaption>
        <img
          src="after/sign-in-320.png"
          alt="Redesigned Vigil sign-in at 320px"
        />
      </figure>
    </div>
  </section>
